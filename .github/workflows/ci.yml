name: CI

# push to main  -> build the image on GitHub, push it to ghcr.io, then point k3s-gitops at it
# pull request  -> only check that it builds
on:
  push:
    branches: [main]
    paths-ignore: ["README.md"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/peyhunter/pathfinder

jobs:
  # ---------- Job 1: turn the code into an image (on GitHub's computer) ----------
  build:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v7

      - name: Pick the image tag
        id: tag
        run: echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - name: Log in to ghcr.io
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build the image (push only from main)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.IMAGE }}:${{ steps.tag.outputs.tag }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------- Job 2: tell the cluster repo about it ----------
  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      TAG: ${{ needs.build.outputs.tag }}
    steps:
      - name: Check out the cluster repo
        uses: actions/checkout@v7
        with:
          repository: PeyHunter/k3s-gitops
          ssh-key: ${{ secrets.GITOPS_DEPLOY_KEY }}

      - name: Point Pathfinder at the new image
        run: |
          f=pathfinder/kustomization.yaml
          if [ ! -f "$f" ]; then
            echo "No $f in k3s-gitops yet, so nothing to deploy. Image ${TAG} is on ghcr.io."
            exit 0
          fi
          sed -i -E "s|newTag: .*|newTag: \"${TAG}\"|" "$f"
          grep newTag "$f"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$f"
          git diff --cached --quiet && { echo "Already on ${TAG}"; exit 0; }
          git commit -m "pathfinder: deploy ${TAG}"
          git push
